name: Status checks

on:
  schedule:
    # GitHub Actions cron is UTC. This is the minimum interval GitHub allows.
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: status-checks
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Run monitors
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check endpoints and store results
        run: npm run checks
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CHECK_SOURCE: github-actions
          CHECK_RETENTION_DAYS: '120'
